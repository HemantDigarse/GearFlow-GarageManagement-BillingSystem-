# ============================================================
# GearFlow - Docker Compose (AWS Production)
# Uses RDS for database instead of local MySQL container
# ============================================================

version: '3.8'

services:
  # ---- Spring Boot Backend ----
  gearflow-backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/gearflow-backend:${IMAGE_TAG:-latest}
    container_name: gearflow-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    networks:
      - gearflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-group: /gearflow/backend
        awslogs-region: ${AWS_REGION}
        awslogs-stream-prefix: backend

  # ---- React Frontend (Nginx) ----
  gearflow-frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/gearflow-frontend:${IMAGE_TAG:-latest}
    container_name: gearflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gearflow-backend:
        condition: service_healthy
    networks:
      - gearflow-network
    logging:
      driver: awslogs
      options:
        awslogs-group: /gearflow/frontend
        awslogs-region: ${AWS_REGION}
        awslogs-stream-prefix: frontend

networks:
  gearflow-network:
    driver: bridge
