# ============================================================
# GearFlow - Ansible Inventory (Auto-generated by Terraform)
# ============================================================
# After running `terraform apply`, update the IP below or
# run: terraform output -raw ansible_inventory > ansible/inventory.ini
# ============================================================

[gearflow]
# Replace with your EC2 public IP from terraform output
YOUR_EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/gearflow-key.pem

[gearflow:vars]
ansible_python_interpreter=/usr/bin/python3
project_name=gearflow
app_dir=/home/ubuntu/gearflow
aws_region=ap-south-1
