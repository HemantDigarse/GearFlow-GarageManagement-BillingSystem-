# ============================================================
# GearFlow - Ansible Playbook: Deploy Application
# ============================================================
# Builds Docker images locally, pushes to ECR, and deploys
# on the EC2 server.
#
# Usage:
#   ansible-playbook -i inventory.ini playbook-deploy.yml --extra-vars "@vars.yml"
# ============================================================

---
- name: Build and Push Docker Images (runs on localhost)
  hosts: localhost
  connection: local
  vars_files:
    - vars.yml

  tasks:
    - name: Get ECR login password
      command: aws ecr get-login-password --region {{ aws_region }}
      register: ecr_password
      changed_when: false

    - name: Login to ECR
      command: >
        docker login --username AWS
        --password {{ ecr_password.stdout }}
        {{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com
      changed_when: false

    - name: Get git commit hash for tagging
      command: git rev-parse --short HEAD
      register: git_hash
      changed_when: false
      ignore_errors: yes

    - name: Set image tag
      set_fact:
        deploy_tag: "{{ git_hash.stdout | default(ansible_date_time.epoch) }}"

    - name: Build Backend Docker image
      command: >
        docker build
        -t {{ ecr_backend_url }}:{{ deploy_tag }}
        -t {{ ecr_backend_url }}:latest
        ./gearflow-backend
      args:
        chdir: "{{ playbook_dir }}/.."

    - name: Build Frontend Docker image
      command: >
        docker build
        -t {{ ecr_frontend_url }}:{{ deploy_tag }}
        -t {{ ecr_frontend_url }}:latest
        ./gearflow-frontend
      args:
        chdir: "{{ playbook_dir }}/.."

    - name: Push Backend image to ECR
      command: "docker push {{ ecr_backend_url }}:{{ item }}"
      loop:
        - "{{ deploy_tag }}"
        - "latest"

    - name: Push Frontend image to ECR
      command: "docker push {{ ecr_frontend_url }}:{{ item }}"
      loop:
        - "{{ deploy_tag }}"
        - "latest"

    - name: Display pushed images
      debug:
        msg:
          - "Backend:  {{ ecr_backend_url }}:{{ deploy_tag }}"
          - "Frontend: {{ ecr_frontend_url }}:{{ deploy_tag }}"

- name: Deploy to EC2 Server
  hosts: gearflow
  become: yes
  become_user: ubuntu
  vars_files:
    - vars.yml

  tasks:
    - name: Login to ECR on EC2
      shell: >
        aws ecr get-login-password --region {{ aws_region }} |
        docker login --username AWS --password-stdin
        {{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com

    - name: Pull latest backend image
      command: "docker pull {{ ecr_backend_url }}:{{ image_tag }}"

    - name: Pull latest frontend image
      command: "docker pull {{ ecr_frontend_url }}:{{ image_tag }}"

    - name: Stop existing containers
      command: docker compose -f {{ app_dir }}/docker-compose.yml down --remove-orphans
      ignore_errors: yes

    - name: Start new containers
      command: docker compose -f {{ app_dir }}/docker-compose.yml up -d
      environment:
        IMAGE_TAG: "{{ image_tag }}"

    - name: Wait for backend to be healthy
      uri:
        url: "http://localhost:8080/actuator/health"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 12
      delay: 10

    - name: Wait for frontend to be ready
      uri:
        url: "http://localhost/"
        status_code: 200
      register: frontend_check
      until: frontend_check.status == 200
      retries: 6
      delay: 5

    - name: Prune old Docker images
      command: docker image prune -af
      changed_when: false

    - name: Display deployment status
      debug:
        msg:
          - "✅ Deployment successful!"
          - "Frontend: http://{{ ansible_host }}"
          - "Backend:  http://{{ ansible_host }}:8080/actuator/health"
