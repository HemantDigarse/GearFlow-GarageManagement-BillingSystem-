name: Backend CI

on:
  workflow_call:
    inputs:
      push_images:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: gearflow-backend/pom.xml
      - name: Verify backend
        working-directory: gearflow-backend
        run: mvn -B -ntp verify
      - name: Check Docker Hub publishing secrets
        if: inputs.push_images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v3
        if: inputs.push_images
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gearflow-backend
          push: ${{ inputs.push_images }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/gearflow-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/gearflow-backend:latest
