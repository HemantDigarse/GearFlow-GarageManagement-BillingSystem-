name: Frontend CI

on:
  workflow_call:
    inputs:
      push_images:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gearflow-frontend/package-lock.json
      - name: Install dependencies
        working-directory: gearflow-frontend
        run: npm ci
      - name: Run frontend tests when configured
        working-directory: gearflow-frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "No frontend test script is configured; build verification will run."
          fi
      - name: Build frontend
        working-directory: gearflow-frontend
        run: npm run build
      - name: Check Docker Hub publishing secrets
        if: inputs.push_images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v3
        if: inputs.push_images
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gearflow-frontend
          push: ${{ inputs.push_images }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/gearflow-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/gearflow-frontend:latest
