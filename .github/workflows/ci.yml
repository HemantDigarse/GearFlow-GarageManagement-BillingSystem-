name: GearFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend-ci.yml
    with:
      push_images: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
  backend:
    uses: ./.github/workflows/backend-ci.yml
    with:
      push_images: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
