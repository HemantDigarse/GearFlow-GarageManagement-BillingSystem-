# ============================================================
# GearFlow - Docker Compose (Local Development & Testing)
# ============================================================
# Usage: docker-compose up -d
# ============================================================

version: '3.8'

services:
  # ---- MySQL Database ----
  gearflow-db:
    image: mysql:8.0
    container_name: gearflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-gearflow}
      MYSQL_USER: ${DB_USER:-gearflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gearflow_pass}
    ports:
      - "3306:3306"
    volumes:
      - gearflow_db_data:/var/lib/mysql
    networks:
      - gearflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Spring Boot Backend ----
  gearflow-backend:
    build:
      context: ./gearflow-backend
      dockerfile: Dockerfile
    container_name: gearflow-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://gearflow-db:3306/${DB_NAME:-gearflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong2024}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      gearflow-db:
        condition: service_healthy
    networks:
      - gearflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---- React Frontend (Nginx) ----
  gearflow-frontend:
    build:
      context: ./gearflow-frontend
      dockerfile: Dockerfile
    container_name: gearflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      gearflow-backend:
        condition: service_healthy
    networks:
      - gearflow-network

volumes:
  gearflow_db_data:
    driver: local

networks:
  gearflow-network:
    driver: bridge
